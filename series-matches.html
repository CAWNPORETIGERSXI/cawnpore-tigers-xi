<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Series - CAWNPORE TIGERS XI</title><link rel="stylesheet" href="style.css"><style>

/* =========================================
   BASIC
========================================= */

html,
body{

    margin:0;
    padding:0;

    background:#111 !important;
    color:#fff !important;

    font-family:Arial,sans-serif;

}


/* =========================================
   CONTAINER
========================================= */

.container{

    width:92%;

    max-width:900px;

    margin:30px auto;

}


/* =========================================
   PAGE TITLE
========================================= */

h1{

    text-align:center;

    color:#ff8800;

}


/* =========================================
   PAGE SUBTITLE
========================================= */

.page-subtitle{

    text-align:center;

    margin-bottom:30px;

}


/* =========================================
   SERIES LIST
========================================= */

#seriesList{

    display:flex;

    flex-direction:column;

    align-items:center;

    width:100%;

}


/* =========================================
   SERIES CARD
========================================= */

.series-card{

    position:relative;

    width:330px;

    min-height:210px;

    box-sizing:border-box;

    background:#111;

    border:4px solid #ff8800;

    border-radius:18px;

    padding:20px;

    margin:0 auto 20px;

    box-shadow:none;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    transition:0.2s ease;

}


/* =========================================
   HOVER
========================================= */

.series-card:hover{

    background:#181818;

    transform:translateY(-3px);

}


/* =========================================
   SERIES IMAGE
========================================= */

.series-image{

    width:100%;

    max-width:270px;

    height:120px;

    object-fit:contain;

    border-radius:10px;

    background:#000;

    margin-bottom:12px;

}


/* =========================================
   SERIES NAME
========================================= */

.series-name{

    font-size:23px;

    font-weight:bold;

    color:#ff9800;

    margin-bottom:8px;

    line-height:1.25;

}


/* =========================================
   SERIES ID
========================================= */

.series-id{

    font-size:13px;

    color:#ccc;

    margin-bottom:5px;

}


/* =========================================
   STATUS
========================================= */

.status{

    position:absolute;

    top:12px;

    right:12px;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    z-index:2;

}


.active{

    background:#063d18;

    color:#00ff66;

}


.completed{

    background:#420808;

    color:#ff4444;

}


/* =========================================
   VIEW BUTTON
========================================= */

.view-btn{

    display:block;

    width:100%;

    box-sizing:border-box;

    text-align:center;

    background:#ff8800;

    color:#000;

    padding:12px;

    border-radius:8px;

    text-decoration:none;

    font-weight:bold;

    margin-top:15px;

}


/* =========================================
   MESSAGE
========================================= */

.message{

    text-align:center;

    margin-top:30px;

    color:#ccc;

}


.error{

    color:#ff4444;

}


/* =========================================
   BACK BUTTON
========================================= */

.back-btn{

    display:block;

    text-align:center;

    background:#ff8800;

    color:#000;

    padding:12px;

    border-radius:8px;

    text-decoration:none;

    font-weight:bold;

    margin:30px 0;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .container{

        width:92%;

    }


    .series-card{

        width:min(330px, 88vw);

        min-height:200px;

        padding:16px;

    }


    .series-image{

        max-width:100%;

        height:110px;

    }


    .series-name{

        font-size:21px;

    }

}

</style></head><body><header><h1>🏏 SERIES</h1><p class="page-subtitle">
CAWNPORE TIGERS XI
</p></header><main class="container"><div id="seriesList"><p class="message">
⏳ Loading Series...
</p></div><a
href="team-matches.html"
class="back-btn"

«»

⬅ BACK TO TEAM MATCHES
</a>

</main><footer style="text-align:center;margin:40px 0;">© 2026 CAWNPORE TIGERS XI

</footer><script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const seriesList =
    document.getElementById("seriesList");


// =====================================================
// LOAD SERIES
// =====================================================

async function loadSeries(){

    try{

        const snapshot =
            await getDocs(
                collection(db,"events")
            );


        seriesList.innerHTML = "";


        let found = false;


        snapshot.forEach((doc)=>{

            const series =
                doc.data();


            // ONLY SERIES EVENTS

            if(
                series.eventType !== "Series"
            ){

                return;

            }


            found = true;


            const card =
                document.createElement("div");

            card.className =
                "series-card";


            const statusClass =
                series.status === "Completed"
                ? "completed"
                : "active";


            const statusText =
                series.status === "Completed"
                ? "🔴 COMPLETED"
                : "🟢 GOING ON";


            card.innerHTML = `

                ${
                    series.imageUrl
                    ?
                    `
                    <img
                        src="${series.imageUrl}"
                        class="series-image"
                        alt="Series Image"
                    >
                    `
                    :
                    ""
                }


                <div class="series-name">

                    ${series.eventName || "Series"}

                </div>


                <div class="series-id">

                    Event ID:
                    ${series.eventId || ""}

                </div>


                <div class="status ${statusClass}">

                    ${statusText}

                </div>


                <a
                    href="series.html?eventId=${encodeURIComponent(series.eventId || "")}"
                    class="view-btn"
                >

                    VIEW SERIES

                </a>

            `;


            seriesList.appendChild(card);

        });


        if(!found){

            seriesList.innerHTML = `

                <p class="message">

                    No Series found yet.

                </p>

            `;

        }

    }
    catch(error){

        console.error(
            "Series Loading Error:",
            error
        );


        seriesList.innerHTML = `

            <p class="message error">

                ❌ Error loading Series.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}


// =====================================================
// START
// =====================================================

loadSeries();

</script></body></html>
