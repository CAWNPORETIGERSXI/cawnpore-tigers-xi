<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CAWNPORE TIGERS XI - Admin Panel</title>

<link
    rel="stylesheet"
    href="style.css"
>


<style>

/* =====================================================
   BODY
===================================================== */

body{

    margin:0;

    background:#111;

    color:#fff;

    font-family:Arial,sans-serif;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:90%;

    max-width:800px;

    margin:30px auto;

    background:#1b1b1b;

    padding:20px;

    border-radius:15px;

    box-sizing:border-box;

}


/* =====================================================
   HEADINGS
===================================================== */

h1,
h2{

    text-align:center;

    color:#ff9800;

}


/* =====================================================
   INPUTS
===================================================== */

input,
textarea,
select{

    width:100%;

    padding:12px;

    margin:10px 0;

    border:none;

    border-radius:8px;

    font-size:16px;

    box-sizing:border-box;

}


/* =====================================================
   BUTTON
===================================================== */

button{

    width:100%;

    padding:14px;

    background:#ff9800;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#e68900;

}

button:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =====================================================
   LOGIN
===================================================== */

#adminPanel{

    display:none;

}


/* =====================================================
   MATCH FORM
===================================================== */

#matchForm{

    display:none;

}


/* =====================================================
   EVENT CARD
===================================================== */

.event-card{

    background:#222;

    padding:15px;

    margin:10px 0;

    border-radius:10px;

}


/* =====================================================
   GALLERY ADMIN
===================================================== */

.gallery-admin-card{

    background:#222;

    border:2px solid #333;

    border-left:5px solid #ff9800;

    padding:18px;

    margin:20px 0;

    border-radius:12px;

}

.gallery-admin-card h3{

    margin-top:0;

    color:#ff9800;

    text-align:center;

}


/* =====================================================
   GALLERY PREVIEW
===================================================== */

.gallery-preview{

    width:100%;

    max-height:300px;

    object-fit:contain;

    background:#111;

    border-radius:10px;

    margin-top:10px;

    display:none;

}


/* =====================================================
   GALLERY MESSAGE
===================================================== */

#galleryMsg{

    text-align:center;

    margin:15px 0;

    font-weight:bold;

}


/* =====================================================
   PLAYER REGISTRATION
===================================================== */

.registration-card{

    background:#222;

    border:2px solid #444;

    border-left:5px solid #ff9800;

    padding:18px;

    margin:15px 0;

    border-radius:12px;

}

.registration-card h3{

    color:#ff9800;

    margin-top:0;

    margin-bottom:12px;

}

.registration-info{

    line-height:1.7;

    color:#ddd;

}

.registration-info strong{

    color:#fff;

}


/* =====================================================
   REGISTRATION STATUS
===================================================== */

.registration-status{

    display:inline-block;

    padding:6px 12px;

    border-radius:20px;

    font-weight:bold;

    margin:8px 0;

}

.status-pending{

    background:#ff9800;

    color:#000;

}

.status-approved{

    background:#00c853;

    color:#fff;

}

.status-rejected{

    background:#e53935;

    color:#fff;

}


/* =====================================================
   REGISTRATION ACTIONS
===================================================== */

.registration-actions{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:15px;

}

.approve-btn{

    background:#00a844;

}

.approve-btn:hover{

    background:#008f3a;

}

.reject-btn{

    background:#d32f2f;

}

.reject-btn:hover{

    background:#b71c1c;

}


/* =====================================================
   REGISTRATION MESSAGE
===================================================== */

#registrationMsg{

    text-align:center;

    margin:15px 0;

    font-weight:bold;

}


/* =====================================================
   GENERAL MESSAGES
===================================================== */

#loginMsg,
#eventMsg{

    text-align:center;

    margin:15px 0;

    font-weight:bold;

}


/* =====================================================
   LABEL
===================================================== */

label{

    color:#ddd;

    font-weight:bold;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .registration-actions{

        grid-template-columns:1fr;

    }

    .container{

        width:94%;

        margin:15px auto;

        padding:15px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<h1>
    🏏 CAWNPORE TIGERS XI
</h1>


<!-- =====================================================
     LOGIN BOX
===================================================== -->

<div id="loginBox">


<h2>
    Admin Login
</h2>


<input
    type="email"
    id="email"
    placeholder="Admin Email"
    autocomplete="username"
>


<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
>


<button
    type="button"
    id="loginBtn"
>

    Login

</button>


<p id="loginMsg"></p>


</div>



<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<div id="adminPanel">


<h2>
    Admin Dashboard
</h2>



<!-- =====================================================
     PLAYER REGISTRATIONS
===================================================== -->

<hr>


<h2>
    🧑‍🏏 Player Registrations
</h2>


<p id="registrationMsg">
    Loading registrations...
</p>


<div id="registrationList"></div>



<!-- =====================================================
     GALLERY
===================================================== -->

<hr>


<h2>
    📸 Gallery
</h2>


<div class="gallery-admin-card">


<h3>
    Upload New Gallery Photos
</h3>


<label>
    Select Images
</label>


<input
    type="file"
    id="galleryImage"
    accept=".jpg,.jpeg,image/jpeg"
    multiple
>


<img
    id="galleryPreview"
    class="gallery-preview"
    alt="Gallery Preview"
>


<p id="galleryMsg"></p>


<button
    type="button"
    id="uploadGalleryBtn"
>

    ⬆️ UPLOAD PHOTOS

</button>


</div>



<!-- =====================================================
     ADD NEW EVENT
===================================================== -->

<hr>


<h2>
    Add New Event
</h2>


<input
    type="text"
    id="eventId"
    placeholder="Event ID"
>


<select id="eventType">

    <option value="">
        Select Event Type
    </option>

    <option value="Tournament">
        Tournament
    </option>

    <option value="Series">
        Series
    </option>

    <option value="Individual Matches">
        Individual Matches
    </option>

</select>


<input
    type="text"
    id="eventName"
    placeholder="Event Name"
>


<label
    style="
        display:block;
        margin-top:15px;
    "
>

    Event Logo / Image (JPG)

</label>


<input
    type="file"
    id="eventImage"
    accept=".jpg,.jpeg,image/jpeg"
>


<label
    style="
        display:block;
        margin-top:15px;
    "
>

    Event Status

</label>


<select id="eventStatus">

    <option value="Active">
        🟢 Going On
    </option>

    <option value="Completed">
        🔴 Completed
    </option>

</select>


<button
    type="button"
    id="saveEventBtn"
>

    SAVE EVENT

</button>


<p id="eventMsg"></p>



<!-- =====================================================
     ADD NEW MATCH
===================================================== -->

<hr>


<h2>
    Add New Match
</h2>


<button
    type="button"
    id="addMatchBtn"
>

    ➕ ADD NEW MATCH

</button>



<!-- =====================================================
     MATCH FORM
===================================================== -->

<div id="matchForm">


<h2>
    Match Details
</h2>


<input
    type="text"
    id="matchId"
    placeholder="Match ID"
>


<select id="matchEventType">

    <option value="">
        Select Event Type
    </option>

    <option value="Tournament">
        Tournament
    </option>

    <option value="Series">
        Series
    </option>

    <option value="Individual Matches">
        Individual Matches
    </option>

</select>


<div
    id="eventSelectBox"
    style="display:none;"
>


<select id="eventSelect">

    <option value="">
        Select Tournament / Series
    </option>

</select>


</div>


<input
    type="date"
    id="matchDate"
>


<input
    type="text"
    id="matchPlace"
    placeholder="Place"
>


<input
    type="text"
    id="opponent"
    placeholder="Opponent"
>


<input
    type="text"
    id="overs"
    placeholder="Overs"
>


<input
    type="text"
    id="result"
    placeholder="Result"
>


<input
    type="text"
    id="playerOfMatch"
    placeholder="Player of the Match"
>


<input
    type="text"
    id="bestBowler"
    placeholder="Best Bowler (Winning Side)"
>


<input
    type="text"
    id="bestBatter"
    placeholder="Best Batter (Winning Side)"
>


<input
    type="text"
    id="fighterOfMatch"
    placeholder="Fighter of Match (Losing Side)"
>


<input
    type="url"
    id="cricHeroesLink"
    placeholder="CricHeroes Link"
>


<button
    type="button"
    id="saveMatchBtn"
>

    SAVE MATCH

</button>


</div>



<!-- =====================================================
     EXISTING EVENTS
===================================================== -->

<hr>


<h2>
    Existing Events
</h2>


<div id="eventList"></div>


</div>


</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script
    type="module"
    src="firebase.js"
></script>


<!-- =====================================================
     ADMIN JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="admin.js"
></script>


</body>

</html>
