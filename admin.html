<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAWNPORE TIGERS XI - Admin Panel</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:800px;
    margin:30px auto;
    background:#1b1b1b;
    padding:20px;
    border-radius:15px;
}

h1,h2{
    text-align:center;
    color:#ff9800;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#e68900;
}

#adminPanel{
    display:none;
}

#matchForm{
    display:none;
}

.event-card{
    background:#222;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>🏏 CAWNPORE TIGERS XI</h1>


<!-- ==========================
     LOGIN
========================== -->

<div id="loginBox">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="login()">Login</button>

<p id="loginMsg"></p>

</div>


<!-- ==========================
     ADMIN PANEL
========================== -->

<div id="adminPanel">

<h2>Admin Dashboard</h2>


<!-- ==========================
     ADD NEW EVENT
========================== -->

<h2>Add New Event</h2>

<input
type="text"
id="eventId"
placeholder="Event ID"
>

<select id="eventType">

<option value="">Select Event Type</option>

<option value="Tournament">
Tournament
</option>

<option value="Series">
Series
</option>

<option value="Individual Matches">
Individual Matches
</option>

</select>

<input
type="text"
id="eventName"
placeholder="Event Name"
>

<button id="saveEventBtn">
SAVE EVENT
</button>

<p id="eventMsg"></p>


<hr>


<!-- ==========================
     ADD NEW MATCH
========================== -->

<h2>Add New Match</h2>

<button id="addMatchBtn">
➕ ADD NEW MATCH
</button>


<!-- ==========================
     MATCH FORM
========================== -->

<div id="matchForm">

<h2>Match Details</h2>

<input
type="text"
id="matchId"
placeholder="Match ID"
>

<select id="matchEventType">

<option value="">
Select Event Type
</option>

<option value="Tournament">
Tournament
</option>

<option value="Series">
Series
</option>

<option value="Individual Matches">
Individual Matches
</option>

</select>

<input
type="text"
id="eventNameForMatch"
placeholder="Tournament / Series Name"
>

<input
type="date"
id="matchDate"
>

<input
type="text"
id="matchPlace"
placeholder="Place"
>

<input
type="text"
id="opponent"
placeholder="Opponent"
>

<input
type="text"
id="overs"
placeholder="Overs"
>

<input
type="text"
id="result"
placeholder="Result"
>

<input
type="text"
id="playerOfMatch"
placeholder="Player of the Match"
>

<input
type="text"
id="bestBowler"
placeholder="Best Bowler (Winning Side)"
>

<input
type="text"
id="bestBatter"
placeholder="Best Batter (Winning Side)"
>

<input
type="text"
id="fighterOfMatch"
placeholder="Fighter of Match (Losing Side)"
>

<input
type="url"
id="cricHeroesLink"
placeholder="CricHeroes Link"
>

<button id="saveMatchBtn">
SAVE MATCH
</button>

</div>


<!-- ==========================
     EXISTING EVENTS
========================== -->

<hr>

<h2>Existing Events</h2>

<div id="eventList"></div>


</div>

</div>


<!-- ==========================
     JAVASCRIPT
========================== -->

<script type="module" src="firebase.js"></script>

<script type="module" src="admin.js"></script>

</body>

</html>
