<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Matches - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">


<style>

/* =========================================
   BASIC
========================================= */

html,
body{

    margin:0;
    padding:0;

    background:#111 !important;
    color:#fff !important;

    font-family:Arial,sans-serif;

}


/* =========================================
   MAIN CONTAINER
========================================= */

.container{

    width:92%;

    max-width:900px;

    margin:30px auto;

}


/* =========================================
   PAGE TITLE
========================================= */

.page-title{

    text-align:center;

    color:#ff8800;

    margin-bottom:8px;

}


/* =========================================
   PAGE SUBTITLE
========================================= */

.page-subtitle{

    text-align:center;

    margin-bottom:30px;

}


/* =========================================
   MATCH BAR
========================================= */

.match-bar{

    display:block;

    width:100%;

    box-sizing:border-box;

    background:#111;

    border:3px solid #ff8800;

    border-radius:10px;

    padding:18px 15px;

    margin:0 0 15px;

    text-decoration:none;

    color:#fff;

    text-align:center;

    transition:0.2s ease;

}


/* =========================================
   HOVER
========================================= */

.match-bar:hover{

    background:#181818;

    transform:translateY(-2px);

}


/* =========================================
   CLICK
========================================= */

.match-bar:active{

    transform:scale(0.98);

}


/* =========================================
   VS
========================================= */

.match-vs{

    color:#ff8800;

    font-weight:bold;

}


/* =========================================
   OPPONENT
========================================= */

.match-opponent{

    color:#fff;

    font-weight:900;

}


/* =========================================
   MESSAGE
========================================= */

.message{

    text-align:center;

    color:#ccc;

    margin:30px 0;

}


.error{

    color:#ff4444;

}


/* =========================================
   BACK BUTTON
========================================= */

.back-btn{

    display:block;

    text-align:center;

    background:#111;

    color:#ff8800;

    border:3px solid #ff8800;

    text-decoration:none;

    padding:12px;

    border-radius:10px;

    font-weight:bold;

    margin:30px 0;

}


.back-btn:hover{

    background:#181818;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .container{

        width:92%;

    }


    .match-bar{

        padding:16px 8px;

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

<h1 class="page-title">
📋 ALL MATCHES
</h1>

<p class="page-subtitle">
CAWNPORE TIGERS XI
</p>

</header>



<main class="container">


<!-- =========================================
     MATCH LIST
========================================= -->

<div id="matchList">

<p class="message">
⏳ Loading All Matches...
</p>

</div>



<!-- =========================================
     BACK BUTTON
========================================= -->

<a
href="team-matches.html"
class="back-btn"
>

⬅ BACK TO TEAM MATCHES

</a>


</main>



<footer style="text-align:center;margin:40px 0;">

© 2026 CAWNPORE TIGERS XI

</footer>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import { db } from "./firebase.js";

import {

    collection,
    getDocs

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const matchList =
document.getElementById(
    "matchList"
);



/* =========================================
   LOAD ALL MATCHES
========================================= */

async function loadAllMatches(){

    try{

        const snapshot =
        await getDocs(
            collection(db,"matches")
        );


        matchList.innerHTML = "";


        let matches = [];



        /* =====================================
           GET MATCHES
        ===================================== */

        snapshot.forEach((doc)=>{

            const match =
            doc.data();


            matches.push({

                ...match,

                firestoreId: doc.id

            });

        });



        /* =====================================
           SORT NEWEST FIRST
        ===================================== */

        matches.sort((a,b)=>{

            const dateA =
            new Date(
                a.matchDate ||
                "1970-01-01"
            );


            const dateB =
            new Date(
                b.matchDate ||
                "1970-01-01"
            );


            return dateB - dateA;

        });



        /* =====================================
           NO MATCHES
        ===================================== */

        if(matches.length === 0){

            matchList.innerHTML = `

                <p class="message">

                    No matches found yet.

                </p>

            `;

            return;

        }



        /* =====================================
           CREATE MATCH BARS
        ===================================== */

        matches.forEach((match)=>{


            const bar =
            document.createElement("a");


            bar.className =
            "match-bar";



            /* =================================
               OPEN MATCH SUMMARY
            ================================= */

            bar.href =
            "match-summary.html?id=" +
            encodeURIComponent(
                match.firestoreId
            );



            /* =================================
               BAR CONTENT
            ================================= */

            bar.innerHTML = `

                <span class="match-vs">

                    🏏 VS

                    <span class="match-opponent">

                        ${
                            match.opponent
                            ||
                            "Opponent Team"
                        }

                    </span>

                </span>

            `;



            matchList.appendChild(bar);

        });

    }

    catch(error){

        console.error(
            "All Matches Error:",
            error
        );


        matchList.innerHTML = `

            <p class="message error">

                ❌ Error loading matches.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   START
========================================= */

loadAllMatches();

</script>



</body>

</html>
