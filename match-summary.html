<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Match Summary - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">

<script src="matches.js"></script>

</head>

<body>

<header>
<h1>🏏 CAWNPORE TIGERS XI</h1>
<h2>Match Summary</h2>
</header>

<div class="summary-box" id="summaryBox"></div>

<script>

const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));
const match = matches[id - 1];

const box = document.getElementById("summaryBox");

if(!match){

box.innerHTML="<h2>Match Not Found!</h2>";

}else{

box.innerHTML=`

<h2>CAWNPORE TIGERS XI vs ${match.opponent}</h2>

<p><b>Date :</b> ${match.date}</p>

<p><b>Venue :</b> ${match.venue || "N/A"}</p>

<p><b>Overs :</b> ${match.overs}</p>

<p><b>Result :</b> ${match.result}</p>

<hr>

<h3>⭐ Player of the Match</h3>
<p>${match.playerOfMatch || "N/A"}</p>

<h3>🔥 Best Batter</h3>
<p>${match.bestBatter || "N/A"}</p>

<h3>🎯 Best Bowler</h3>
<p>${match.bestBowler || "N/A"}</p>

${match.summaryImage ? `

<hr>

<h3>📸 Match Summary</h3>

<img src="${match.summaryImage}"
style="width:100%;
border:3px solid orange;
border-radius:10px;
margin-top:10px;">

` : ""}

`;

}

</script>

</body>
</html>
