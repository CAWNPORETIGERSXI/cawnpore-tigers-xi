<!DOCTYPE html>
<html>
<head>

<title>Match Summary - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">

<script src="matches.js"></script>

</head>

<body>

<header>

<h1>🏏 CAWNPORE TIGERS XI</h1>
<h2>Match Summary</h2>

</header>


<div class="summary-box" id="summaryBox">

</div>


<script>

let params = new URLSearchParams(window.location.search);

let id = Number(params.get("id"));

let match = matches[id - 1];


let box = document.getElementById("summaryBox");


box.innerHTML = `

<h2>CAWNPORE TIGERS XI vs ${match.opponent}</h2>

<p><b>Date:</b> ${match.date}</p>

<p><b>Venue:</b> ${match.venue || "N/A"}</p>

<p><b>Overs:</b> ${match.overs}</p>

<p><b>Result:</b> ${match.result}</p>


<hr>

<h3>⭐ Player of the Match</h3>

<p>${match.playerOfMatch || "N/A"}</p>


<h3>🔥 Best Batter</h3>

<p>${match.bestBatter || "N/A"}</p>


<h3>🎯 Best Bowler</h3>

<p>${match.bestBowler || "N/A"}</p>


${match.summaryImage ? 
`<img src="${match.summaryImage}" width="100%">`
: ""}


`;

</script>


</body>
</html>
