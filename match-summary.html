<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Match Summary - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   BODY
===================================================== */

body{
    margin:0;
    background:#080808;
    color:#ffffff;
    font-family:Arial,sans-serif;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:94%;
    max-width:1000px;
    margin:20px auto 40px;
}


/* =====================================================
   TITLE
===================================================== */

.page-title{
    text-align:center;
    color:#ff8800;
    font-size:38px;
    font-weight:900;
    margin:18px 0 28px;

    text-shadow:
        0 0 10px rgba(255,136,0,.35);
}


/* =====================================================
   SUMMARY CARD
===================================================== */

.summary-card{

    width:100%;
    box-sizing:border-box;

    background:#090909;

    border:5px solid #ff8800;

    border-radius:22px;

    padding:28px;

    box-shadow:
        0 0 18px rgba(255,136,0,.35),
        0 0 35px rgba(255,136,0,.12);
}


/* =====================================================
   DATE
===================================================== */

.match-date{

    text-align:center;

    color:#ffffff;

    font-size:20px;

    font-weight:900;

    margin-bottom:18px;
}


/* =====================================================
   TEAMS
===================================================== */

.teams{

    text-align:center;

    color:#ffffff;

    font-size:40px;

    font-weight:900;

    line-height:1.4;

    margin:8px 0 28px;
}


/* =====================================================
   VS
===================================================== */

.teams .vs{

    display:inline-block;

    color:#ff8800;

    font-size:34px;

    font-weight:900;

    margin:5px 0;
}


/* =====================================================
   RESULT
===================================================== */

.result{

    width:100%;

    box-sizing:border-box;

    text-align:center;

    color:#00ff66;

    background:#052b15;

    border:3px solid #009f40;

    border-radius:17px;

    font-size:32px;

    font-weight:900;

    padding:22px 15px;

    margin-bottom:25px;
}


/* =====================================================
   INFO BOX
===================================================== */

.info-box{

    width:100%;

    min-height:120px;

    box-sizing:border-box;

    display:flex;

    align-items:center;

    gap:18px;

    background:#090909;

    border:4px solid #ff8800;

    border-radius:17px;

    padding:16px 18px;

    margin:15px 0;

    box-shadow:
        0 0 8px rgba(255,136,0,.20);
}


/* =====================================================
   ICON
===================================================== */

.info-icon{

    width:82px;

    height:82px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#171717;

    border-radius:14px;

    font-size:44px;
}


/* =====================================================
   LABEL
===================================================== */

.info-label{

    flex:1;

    color:#ff8800;

    font-size:27px;

    font-weight:900;

    line-height:1.2;
}


/* =====================================================
   VALUE
===================================================== */

.info-value{

    min-width:310px;

    box-sizing:border-box;

    padding:19px 18px;

    text-align:center;

    background:#090909;

    color:#ffffff;

    border:3px solid #ff8800;

    border-radius:12px;

    font-size:31px;

    font-weight:900;

    line-height:1.2;

    word-break:break-word;
}


/* =====================================================
   SCORECARD LINK BOX
===================================================== */

.cricheroes-box{

    width:100%;

    min-height:90px;

    box-sizing:border-box;

    display:flex;

    align-items:center;

    gap:18px;

    background:#090909;

    border:4px solid #ff8800;

    border-radius:17px;

    padding:15px 20px;

    margin-top:18px;

    color:#ffffff;

    cursor:pointer;

    transition:.2s;

    -webkit-tap-highlight-color:transparent;

}


.cricheroes-box:hover{

    background:#151515;

    box-shadow:
        0 0 15px rgba(255,136,0,.45);
}


/* =====================================================
   LINK ICON
===================================================== */

.cricheroes-icon{

    font-size:40px;

    flex-shrink:0;
}


/* =====================================================
   LINK TEXT
===================================================== */

.cricheroes-text{

    color:#ffffff;

    font-size:20px;

    font-weight:900;

    line-height:1.3;

    word-break:break-all;
}


/* =====================================================
   OPEN SCORECARD
===================================================== */

.open-scorecard{

    display:block;

    margin-top:6px;

    color:#ff8800;

    font-size:18px;

    font-weight:900;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    text-align:center;

    color:#cccccc;

    font-size:20px;

    margin:40px 0;
}


.error{

    color:#ff4444;
}


/* =====================================================
   FOOTER
===================================================== */

footer{

    width:100%;

    box-sizing:border-box;

    padding:20px;

    margin-top:30px;

    background:#000000;

    border-top:1px solid #222222;

    color:#aaaaaa;

    text-align:center;

    font-size:14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .container{

        width:94%;

        margin:18px auto 30px;
    }


    .page-title{

        font-size:30px;

        margin-bottom:22px;
    }


    .summary-card{

        padding:14px;

        border-width:5px;

        border-radius:18px;
    }


    .match-date{

        font-size:18px;
    }


    .teams{

        font-size:30px;

        line-height:1.4;

        margin-bottom:25px;
    }


    .teams .vs{

        font-size:27px;
    }


    .result{

        font-size:25px;

        padding:18px 10px;
    }


    .info-box{

        min-height:115px;

        display:grid;

        grid-template-columns:68px 1fr;

        gap:8px 12px;

        padding:12px;

        border-width:4px;

        border-radius:14px;
    }


    .info-icon{

        width:68px;

        height:68px;

        grid-row:span 2;

        font-size:35px;

        border-radius:11px;
    }


    .info-label{

        font-size:21px;

        align-self:end;
    }


    .info-value{

        width:100%;

        min-width:0;

        padding:12px 8px;

        font-size:26px;

        border-width:3px;
    }


    .cricheroes-box{

        min-height:85px;

        padding:12px;

        gap:12px;
    }


    .cricheroes-icon{

        font-size:32px;
    }


    .cricheroes-text{

        font-size:16px;
    }


    .open-scorecard{

        font-size:15px;
    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:370px){

    .teams{

        font-size:26px;
    }


    .teams .vs{

        font-size:23px;
    }


    .result{

        font-size:21px;
    }


    .info-label{

        font-size:18px;
    }


    .info-value{

        font-size:22px;
    }


    .cricheroes-text{

        font-size:14px;
    }

}

</style>

</head>


<body>


<header>

    <h1 class="page-title">

        🏏 MATCH SUMMARY

    </h1>

</header>


<main class="container">

    <div id="summary">

        <p class="message">

            ⏳ Loading Match Summary...

        </p>

    </div>

</main>


<footer>

    © 2026 CAWNPORE TIGERS XI

</footer>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import { db } from "./firebase.js";

import {

    collection,

    getDocs

}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   MATCH ID
===================================================== */

const params = new URLSearchParams(
    window.location.search
);

const matchId = params.get("id");

const summary =
    document.getElementById("summary");


/* =====================================================
   LOAD MATCH
===================================================== */

async function loadMatch(){

    if(!matchId){

        summary.innerHTML = `

            <p class="message error">

                ❌ Match ID not found.

            </p>

        `;

        return;

    }


    try{


        const snapshot = await getDocs(
            collection(db,"matches")
        );


        let selectedMatch = null;


        snapshot.forEach((doc)=>{

            const match = doc.data();


            if(

                String(match.matchId || "") ===
                String(matchId)

                ||

                doc.id === matchId

            ){

                selectedMatch = match;

            }

        });


        /* =============================================
           MATCH NOT FOUND
        ============================================= */

        if(!selectedMatch){

            summary.innerHTML = `

                <p class="message error">

                    ❌ Match not found.

                </p>

            `;

            return;

        }


        /* =============================================
           GET URL FROM ADMIN PANEL
        ============================================= */

        let cricHeroesUrl =

            selectedMatch.cricHeroesLink ||

            selectedMatch.cricHeroesUrl ||

            "";


        cricHeroesUrl =
            String(cricHeroesUrl).trim();


        /* =============================================
           FIX URL
        ============================================= */

        if(

            cricHeroesUrl &&

            !cricHeroesUrl.startsWith("http://") &&

            !cricHeroesUrl.startsWith("https://")

        ){

            cricHeroesUrl =
                "https://" + cricHeroesUrl;

        }


        /* =============================================
           SUMMARY
        ============================================= */

        summary.innerHTML = `

            <div class="summary-card">


                <div class="match-date">

                    📅
                    ${selectedMatch.matchDate || "—"}

                </div>


                <div class="teams">

                    CAWNPORE TIGERS XI

                    <br>

                    <span class="vs">

                        VS

                    </span>

                    <br>

                    ${selectedMatch.opponent || "—"}

                </div>


                <div class="result">

                    🏆
                    ${selectedMatch.result || "—"}

                </div>


                <!-- PLACE -->

                <div class="info-box">

                    <div class="info-icon">
                        📍
                    </div>

                    <div class="info-label">
                        PLACE
                    </div>

                    <div class="info-value">
                        ${selectedMatch.place || "—"}
                    </div>

                </div>


                <!-- OVERS -->

                <div class="info-box">

                    <div class="info-icon">
                        🏏
                    </div>

                    <div class="info-label">
                        OVERS
                    </div>

                    <div class="info-value">
                        ${selectedMatch.overs || "—"}
                    </div>

                </div>


                <!-- PLAYER OF MATCH -->

                <div class="info-box">

                    <div class="info-icon">
                        ⭐
                    </div>

                    <div class="info-label">
                        PLAYER OF THE MATCH
                    </div>

                    <div class="info-value">
                        ${selectedMatch.playerOfMatch || "—"}
                    </div>

                </div>


                <!-- BEST BATSMAN -->

                <div class="info-box">

                    <div class="info-icon">
                        🏏
                    </div>

                    <div class="info-label">
                        BEST BATSMAN
                    </div>

                    <div class="info-value">
                        ${selectedMatch.bestBatter || "—"}
                    </div>

                </div>


                <!-- BEST BOWLER -->

                <div class="info-box">

                    <div class="info-icon">
                        🔴
                    </div>

                    <div class="info-label">
                        BEST BOWLER
                    </div>

                    <div class="info-value">
                        ${selectedMatch.bestBowler || "—"}
                    </div>

                </div>


                <!-- FIGHTER -->

                ${
                    selectedMatch.fighterOfMatch

                    ?

                    `

                    <div class="info-box">

                        <div class="info-icon">
                            ⚔️
                        </div>

                        <div class="info-label">
                            FIGHTER OF THE MATCH
                        </div>

                        <div class="info-value">
                            ${selectedMatch.fighterOfMatch}
                        </div>

                    </div>

                    `

                    :

                    ""

                }


                <!-- SCORECARD -->

                ${
                    cricHeroesUrl

                    ?

                    `

                    <div

                        class="cricheroes-box"

                        id="scorecardLinkBox"

                    >

                        <span class="cricheroes-icon">

                            🌐

                        </span>


                        <span>

                            <span class="cricheroes-text">

                                ${cricHeroesUrl}

                            </span>


                            <span class="open-scorecard">

                                🔗 OPEN MATCH SCORECARD

                            </span>

                        </span>

                    </div>

                    `

                    :

                    `

                    <div class="cricheroes-box">

                        <span class="cricheroes-icon">

                            🌐

                        </span>

                        <span class="cricheroes-text">

                            Match scorecard link not available.

                        </span>

                    </div>

                    `

                }


            </div>

        `;


        /* =================================================
           OPEN ADMIN URL
        ================================================= */

        const scorecardLinkBox =
            document.getElementById(
                "scorecardLinkBox"
            );


        if(

            scorecardLinkBox &&

            cricHeroesUrl

        ){

            scorecardLinkBox.onclick = function(){

                window.location.href =
                    cricHeroesUrl;

            };


            scorecardLinkBox.onkeydown =
                function(event){

                    if(

                        event.key === "Enter" ||

                        event.key === " "

                    ){

                        event.preventDefault();

                        window.location.href =
                            cricHeroesUrl;

                    }

                };

        }


    }

    catch(error){

        console.error(
            "MATCH SUMMARY ERROR:",
            error
        );


        summary.innerHTML = `

            <p class="message error">

                ❌ Error loading match summary.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}


/* =====================================================
   START
===================================================== */

loadMatch();

</script>


</body>

</html>
