<style>

/* =====================================================
   GALLERY
===================================================== */

.gallery{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:18px;

    padding:20px;

}


.gallery img{

    width:100%;

    height:220px;

    object-fit:cover;

    border-radius:12px;

    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.gallery img:hover{

    transform:scale(1.03);

    box-shadow:
        0 0 18px
        rgba(255,152,0,.7);

}


/* =====================================================
   LOADING
===================================================== */

#galleryLoading{

    text-align:center;

    color:#ff9800;

    font-size:18px;

    padding:20px;

}


/* =====================================================
   LIGHTBOX
===================================================== */

#lightbox{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.95);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:9999;

    padding:20px;

}


#lightbox.show{

    display:flex;

}


#lightboxImage{

    max-width:92vw;

    max-height:88vh;

    object-fit:contain;

    border-radius:10px;

    box-shadow:
        0 0 30px
        rgba(255,152,0,.5);

}


/* =====================================================
   CLOSE
===================================================== */

#closeLightbox{

    position:absolute;

    top:20px;

    right:25px;

    width:45px;

    height:45px;

    border:none;

    border-radius:50%;

    background:#ff9800;

    color:#fff;

    font-size:28px;

    cursor:pointer;

    z-index:10001;

}


/* =====================================================
   PREVIOUS / NEXT
===================================================== */

.lightbox-btn{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;

    background:
        rgba(255,152,0,.9);

    color:#fff;

    font-size:30px;

    cursor:pointer;

    z-index:10000;

}


#prevBtn{

    left:20px;

}


#nextBtn{

    right:20px;

}


.lightbox-btn:hover,
#closeLightbox:hover{

    background:#e68900;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .gallery{

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;

        padding:10px;

    }


    .gallery img{

        height:160px;

    }


    #lightboxImage{

        max-width:96vw;

        max-height:82vh;

    }


    .lightbox-btn{

        width:42px;

        height:42px;

        font-size:24px;

    }


    #prevBtn{

        left:8px;

    }


    #nextBtn{

        right:8px;

    }


    #closeLightbox{

        top:10px;

        right:10px;

    }

}

<script type="module">

import { db } from "./firebase.js";

import {

    collection,
    getDocs

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =====================================================
   ELEMENTS
===================================================== */

const firebaseGallery =
    document.getElementById(
        "firebaseGallery"
    );


const galleryLoading =
    document.getElementById(
        "galleryLoading"
    );



/* =====================================================
   LOAD FIREBASE GALLERY
===================================================== */

async function loadFirebaseGallery(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "gallery"
                )
            );


        firebaseGallery.innerHTML = "";


        if(snapshot.empty){

            galleryLoading.innerText =
                "No new photos uploaded yet.";

            return;

        }


        snapshot.forEach(
            (galleryDoc)=>{

                const data =
                    galleryDoc.data();


                if(!data.imageUrl){

                    return;

                }


                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    data.imageUrl;


                image.alt =
                    "CAWNPORE TIGERS XI";


                image.loading =
                    "lazy";


                firebaseGallery.appendChild(
                    image
                );

            }
        );


        galleryLoading.style.display =
            "none";


        /*
         * Re-initialize Lightbox
         * after Firebase photos load.
         */

        setupLightbox();

    }

    catch(error){

        console.error(
            "GALLERY LOAD ERROR:",
            error
        );


        galleryLoading.innerText =
            "❌ Unable to load gallery.";

    }

}



/* =====================================================
   LIGHTBOX
===================================================== */

let galleryImages = [];

let currentIndex = 0;


function setupLightbox(){

    galleryImages =
        Array.from(
            document.querySelectorAll(
                ".gallery img"
            )
        );


    const lightbox =
        document.getElementById(
            "lightbox"
        );


    const lightboxImage =
        document.getElementById(
            "lightboxImage"
        );


    const closeLightbox =
        document.getElementById(
            "closeLightbox"
        );


    const prevBtn =
        document.getElementById(
            "prevBtn"
        );


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    galleryImages.forEach(
        (image,index)=>{

            /*
             * Avoid duplicate listeners
             */

            image.onclick =
                function(){

                    currentIndex =
                        index;

                    showImage();

                    lightbox.classList.add(
                        "show"
                    );

                };

        }
    );


    function showImage(){

        if(
            !galleryImages.length
        ){

            return;

        }


        lightboxImage.src =
            galleryImages[
                currentIndex
            ].src;


        lightboxImage.alt =
            galleryImages[
                currentIndex
            ].alt;

    }


    nextBtn.onclick =
        function(event){

            event.stopPropagation();


            currentIndex++;


            if(
                currentIndex >=
                galleryImages.length
            ){

                currentIndex = 0;

            }


            showImage();

        };


    prevBtn.onclick =
        function(event){

            event.stopPropagation();


            currentIndex--;


            if(
                currentIndex < 0
            ){

                currentIndex =
                    galleryImages.length - 1;

            }


            showImage();

        };


    closeLightbox.onclick =
        function(){

            lightbox.classList.remove(
                "show"
            );

        };


    lightbox.onclick =
        function(event){

            if(
                event.target ===
                lightbox
            ){

                lightbox.classList.remove(
                    "show"
                );

            }

        };

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        const lightbox =
            document.getElementById(
                "lightbox"
            );


        if(
            !lightbox.classList.contains(
                "show"
            )
        ){

            return;

        }


        if(
            event.key === "Escape"
        ){

            lightbox.classList.remove(
                "show"
            );

        }


        if(
            event.key === "ArrowRight"
        ){

            document
                .getElementById(
                    "nextBtn"
                )
                .click();

        }


        if(
            event.key === "ArrowLeft"
        ){

            document
                .getElementById(
                    "prevBtn"
                )
                .click();

        }

    }
);



/* =====================================================
   START
===================================================== */

loadFirebaseGallery();

</script>
