<!-- =====================================================
     FIREBASE GALLERY SCRIPT
===================================================== -->

<script type="module">

import { db } from "./firebase.js";

import {

    collection,

    getDocs,

    query,

    orderBy

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const galleryContainer =
    document.getElementById(
        "adminGallery"
    );


const galleryLoading =
    document.getElementById(
        "galleryLoading"
    );



async function loadGallery(){

    try{

        const galleryQuery =
            query(

                collection(
                    db,
                    "gallery"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                )

            );


        const snapshot =
            await getDocs(
                galleryQuery
            );


        if(
            snapshot.empty
        ){

            galleryContainer.innerHTML =

                `
                <p class="gallery-loading">
                    No new photos uploaded yet.
                </p>
                `;

            return;

        }


        galleryContainer.innerHTML = "";


        snapshot.forEach(

            (photoDoc) => {

                const photo =
                    photoDoc.data();


                if(
                    !photo.imageUrl
                ){

                    return;

                }


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    photo.imageUrl;


                img.alt =
                    "CAWNPORE TIGERS XI";


                img.loading =
                    "lazy";


                galleryContainer.appendChild(
                    img
                );

            }

        );

    }

    catch(error){

        console.error(
            "GALLERY LOAD ERROR:",
            error
        );


        galleryContainer.innerHTML =

            `
            <p class="gallery-error">
                ❌ Unable to load gallery photos.
            </p>
            `;

    }

}



loadGallery();

</script>
