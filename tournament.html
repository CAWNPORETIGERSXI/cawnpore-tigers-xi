<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tournament - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">


<style>

/* =========================================
   BASIC
========================================= */

html,
body {

    margin: 0;
    padding: 0;

    background: #111 !important;
    color: #fff !important;

    font-family: Arial, sans-serif;

}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {

    width: 92%;
    max-width: 700px;

    margin: 30px auto;

}


/* =========================================
   PAGE TITLE
========================================= */

.page-title {

    text-align: center;

    color: #ff8800;

    margin-bottom: 8px;

}


/* =========================================
   TOURNAMENT INFORMATION CARD
========================================= */

.tournament-card {

    position: relative;

    background: #111;

    border: 2px solid #ff8800;

    border-radius: 12px;

    padding: 15px;

    margin-bottom: 30px;

}


/* =========================================
   TOURNAMENT IMAGE
========================================= */

.tournament-image {

    width: 100%;

    max-height: 260px;

    object-fit: contain;

    background: #000;

    border-radius: 10px;

    margin-bottom: 15px;

}


/* =========================================
   TOURNAMENT NAME
========================================= */

.tournament-name {

    font-size: 27px;

    color: #ff9800;

    font-weight: bold;

    margin-bottom: 8px;

}


/* =========================================
   EVENT ID
========================================= */

.tournament-id {

    color: #ccc;

    font-size: 13px;

}


/* =========================================
   STATUS
========================================= */

.status {

    display: inline-block;

    padding: 7px 12px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    margin-top: 10px;

}


.active {

    background: #063d18;

    color: #00ff66;

}


.completed {

    background: #420808;

    color: #ff4444;

}


/* =========================================
   MATCHES TITLE
========================================= */

.matches-title {

    text-align: center;

    color: #ff8800;

    margin: 30px 0 20px;

}


/* =========================================
   MATCH LIST
========================================= */

#matchList {

    display: flex;

    flex-direction: column;

    width: 100%;

    gap: 20px;

}


/* =========================================
   MATCH CARD
========================================= */

.match-card {

    display: block;

    width: 100%;

    box-sizing: border-box;

    background: #000;

    color: #fff;

    border: 2px solid #ff8800;

    border-radius: 12px;

    padding: 20px;

    text-align: center;

    text-decoration: none;

    box-shadow:
        0 0 8px rgba(255,136,0,0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;

}


/* =========================================
   HOVER
========================================= */

.match-card:hover {

    background: #080808;

    transform: translateY(-2px);

    box-shadow:
        0 0 15px rgba(255,136,0,0.45);

}


/* =========================================
   CLICK
========================================= */

.match-card:active {

    transform: scale(0.98);

}


/* =========================================
   DATE
========================================= */

.match-date {

    color: #ff8800;

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 12px;

}


/* =========================================
   TEAMS
========================================= */

.match-teams {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 6px;

}


/* =========================================
   CAWNPORE TIGERS XI
========================================= */

.team-name {

    color: #fff;

    font-size: 20px;

    font-weight: 900;

    line-height: 1.25;

}


/* =========================================
   VS
========================================= */

.vs {

    color: #ff8800;

    font-size: 17px;

    font-weight: bold;

}


/* =========================================
   OPPONENT
========================================= */

.opponent-name {

    color: #fff;

    font-size: 20px;

    font-weight: 900;

    line-height: 1.25;

    overflow-wrap: anywhere;

}


/* =========================================
   MATCH INFO
========================================= */

.match-info {

    margin-top: 15px;

    padding-top: 12px;

    border-top: 1px solid #333;

    display: flex;

    justify-content: center;

    gap: 25px;

    flex-wrap: wrap;

}


/* =========================================
   INFO ITEM
========================================= */

.info-item {

    color: #ccc;

    font-size: 15px;

}


.info-label {

    color: #ff8800;

    font-weight: bold;

}


/* =========================================
   RESULT
========================================= */

.match-result {

    margin-top: 14px;

    color: #00ff66;

    font-size: 17px;

    font-weight: 900;

    line-height: 1.35;

}


/* =========================================
   MESSAGE
========================================= */

.message {

    text-align: center;

    color: #ccc;

    margin: 30px 0;

}


.error {

    color: #ff4444;

}


/* =========================================
   BACK BUTTON
========================================= */

.back-btn {

    display: block;

    text-align: center;

    background: #000;

    color: #ff8800;

    border: 2px solid #ff8800;

    text-decoration: none;

    padding: 12px;

    border-radius: 10px;

    font-weight: bold;

    margin: 30px 0;

}


.back-btn:hover {

    background: #181818;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .container {

        width: 92%;

        margin: 25px auto;

    }


    .page-title {

        font-size: 24px;

    }


    .tournament-name {

        font-size: 22px;

    }


    #matchList {

        gap: 18px;

    }


    .match-card {

        padding: 18px 14px;

        border-radius: 11px;

    }


    .match-date {

        font-size: 15px;

    }


    .team-name,
    .opponent-name {

        font-size: 18px;

    }


    .vs {

        font-size: 16px;

    }


    .match-info {

        gap: 15px;

    }


    .match-result {

        font-size: 16px;

    }

}


/* =========================================
   SMALL MOBILE
========================================= */

@media (max-width: 380px) {

    .container {

        width: 94%;

    }


    .match-card {

        padding: 16px 12px;

    }


    .team-name,
    .opponent-name {

        font-size: 17px;

    }


    .match-result {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h1 class="page-title">

        🏆 TOURNAMENT

    </h1>


    <p style="text-align:center;">

        CAWNPORE TIGERS XI

    </p>

</header>



<main class="container">


<!-- =========================================
     TOURNAMENT INFORMATION
========================================= -->

<div id="tournamentInfo">

    <p class="message">

        ⏳ Loading Tournament...

    </p>

</div>



<!-- =========================================
     MATCHES TITLE
========================================= -->

<h2 class="matches-title">

    🏏 TOURNAMENT MATCHES

</h2>



<!-- =========================================
     MATCH LIST
========================================= -->

<div id="matchList">

    <p class="message">

        ⏳ Loading Matches...

    </p>

</div>



<!-- =========================================
     BACK BUTTON
========================================= -->

<a
    href="tournament-matches.html"
    class="back-btn"
>

    ⬅ BACK TO TOURNAMENTS

</a>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer
    style="
        text-align:center;
        margin:40px 0;
    "
>

    © 2026 CAWNPORE TIGERS XI

</footer>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import { db } from "./firebase.js";

import {

    collection,
    getDocs

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================
   GET EVENT ID
========================================= */

const params =
new URLSearchParams(
    window.location.search
);


const eventId =
params.get("eventId");



/* =========================================
   ELEMENTS
========================================= */

const tournamentInfo =
document.getElementById(
    "tournamentInfo"
);


const matchList =
document.getElementById(
    "matchList"
);



/* =========================================
   LOAD TOURNAMENT
========================================= */

async function loadTournament() {

    try {


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "events"
                )
            );


        let tournament = null;



        snapshot.forEach((doc) => {


            const event =
                doc.data();



            if (

                event.eventId === eventId

                &&

                (

                    event.eventType ===
                    "Tournament"

                    ||

                    event.eventType ===
                    "TOURNAMENT"

                )

            ) {

                tournament = event;

            }

        });



        /* =================================
           TOURNAMENT NOT FOUND
        ================================= */

        if (!tournament) {

            tournamentInfo.innerHTML = `

                <p class="message error">

                    ❌ Tournament not found.

                </p>

            `;

            return;

        }



        /* =================================
           STATUS
        ================================= */

        const statusClass =

            tournament.status ===
            "Completed"

            ?

            "completed"

            :

            "active";



        const statusText =

            tournament.status ===
            "Completed"

            ?

            "🔴 COMPLETED"

            :

            "🟢 GOING ON";



        /* =================================
           IMAGE
        ================================= */

        const imageURL =

            tournament.imageUrl

            ||

            tournament.imageURL

            ||

            tournament.image

            ||

            "";



        /* =================================
           TOURNAMENT CARD
        ================================= */

        tournamentInfo.innerHTML = `

            <div class="tournament-card">


                ${
                    imageURL

                    ?

                    `

                    <img

                        src="${imageURL}"

                        class="tournament-image"

                        alt="Tournament Image"

                    >

                    `

                    :

                    ""

                }


                <div class="tournament-name">

                    ${
                        tournament.eventName
                        ||
                        "Tournament"
                    }

                </div>


                <div class="tournament-id">

                    Event ID:

                    ${
                        tournament.eventId
                        ||
                        eventId
                    }

                </div>


                <div class="status ${statusClass}">

                    ${statusText}

                </div>


            </div>

        `;

    }


    catch (error) {


        console.error(
            "Tournament Error:",
            error
        );


        tournamentInfo.innerHTML = `

            <p class="message error">

                ❌ Error loading tournament.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   LOAD TOURNAMENT MATCHES
========================================= */

async function loadTournamentMatches() {

    try {


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "matches"
                )
            );


        matchList.innerHTML = "";



        let matches = [];



        /* =================================
           GET THIS TOURNAMENT MATCHES
        ================================= */

        snapshot.forEach((doc) => {


            const match =
                doc.data();



            if (
                match.eventId !== eventId
            ) {

                return;

            }



            matches.push({

                ...match,

                firestoreId: doc.id

            });

        });



        /* =================================
           SORT NEWEST FIRST
        ================================= */

        matches.sort((a, b) => {


            const dateA =
                new Date(
                    a.matchDate ||
                    a.date ||
                    "1970-01-01"
                );


            const dateB =
                new Date(
                    b.matchDate ||
                    b.date ||
                    "1970-01-01"
                );


            return dateB - dateA;

        });



        /* =================================
           NO MATCHES
        ================================= */

        if (
            matches.length === 0
        ) {

            matchList.innerHTML = `

                <p class="message">

                    No matches found for this
                    tournament yet.

                </p>

            `;

            return;

        }



        /* =================================
           CREATE MATCH CARDS
        ================================= */

        matches.forEach((match) => {


            const card =
                document.createElement("a");



            card.className =
                "match-card";



            /* =================================
               OPEN MATCH SUMMARY
            ================================= */

            card.href =
                "match-summary.html?id=" +
                encodeURIComponent(
                    match.matchId ||
                    match.firestoreId
                );



            /* =================================
               DATE
            ================================= */

            let displayDate =
                match.matchDate ||
                match.date ||
                "";



            if (displayDate) {


                const dateObj =
                    new Date(
                        displayDate
                    );


                if (
                    !isNaN(
                        dateObj.getTime()
                    )
                ) {

                    displayDate =
                        dateObj.toLocaleDateString(
                            "en-GB",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric"
                            }
                        );

                }

            }



            /* =================================
               OPPONENT
            ================================= */

            const opponent =
                match.opponent ||
                "Opponent Team";



            /* =================================
               OVERS
            ================================= */

            const overs =
                match.overs ||
                match.totalOvers ||
                "—";



            /* =================================
               RESULT
            ================================= */

            const result =
                match.result ||
                "Result Not Available";



            /* =================================
               CARD CONTENT
            ================================= */

            card.innerHTML = `

                <div class="match-date">

                    📅 ${displayDate}

                </div>


                <div class="match-teams">


                    <div class="team-name">

                        CAWNPORE TIGERS XI

                    </div>


                    <div class="vs">

                        VS

                    </div>


                    <div class="opponent-name">

                        ${opponent}

                    </div>


                </div>


                <div class="match-info">


                    <div class="info-item">

                        <span class="info-label">

                            OVERS:

                        </span>

                        ${overs}

                    </div>


                </div>


                <div class="match-result">

                    ${result}

                </div>

            `;



            matchList.appendChild(
                card
            );

        });

    }


    catch (error) {


        console.error(
            "Match Loading Error:",
            error
        );


        matchList.innerHTML = `

            <p class="message error">

                ❌ Error loading tournament matches.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   START
========================================= */

if (eventId) {

    loadTournament();

    loadTournamentMatches();

}

else {


    tournamentInfo.innerHTML = `

        <p class="message error">

            ❌ Tournament ID not found.

        </p>

    `;


    matchList.innerHTML = "";

}

</script>


</body>

</html>
