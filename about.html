<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>About | CAWNPORE TIGERS XI</title><link rel="stylesheet" href="style.css"><style>

/* =========================================
   ABOUT PAGE
========================================= */

.about-page {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 35px 15px 50px;
    text-align: center;
}


/* PAGE TITLE */

.about-page h1 {
    margin: 10px 0 8px;

    color: #ff8800;

    font-size: clamp(30px, 8vw, 48px);

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1px;

    text-shadow:
        0 0 8px rgba(255,136,0,.5),
        0 0 18px rgba(255,136,0,.25);
}


/* TITLE LINE */

.about-line {
    width: 130px;
    height: 4px;

    margin: 0 auto 28px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #ff3300,
            #ff8800,
            #ffd000,
            #ff8800,
            #ff3300
        );

    box-shadow:
        0 0 8px #ff8800,
        0 0 18px #ff4400;
}


/* OWNER CARD */

.owner-card {
    width: 100%;

    background:
        linear-gradient(
            145deg,
            #151515,
            #080808
        );

    border: 3px solid #ff8800;

    border-radius: 22px;

    padding: 25px 20px 30px;

    box-shadow:
        0 0 15px rgba(255,136,0,.45),
        0 0 30px rgba(255,136,0,.18);
}


/* OWNER PHOTO */

.owner-photo {
    width: 100%;
    max-width: 360px;

    height: 390px;

    object-fit: cover;

    display: block;

    margin: 0 auto 25px;

    border: 4px solid #ff8800;

    border-radius: 22px;

    box-shadow:
        0 0 12px rgba(255,136,0,.65),
        0 0 28px rgba(255,136,0,.25);
}


/* OWNER NAME */

.owner-card h2 {
    margin: 5px 0 8px;

    color: #fff;

    font-size: clamp(26px, 7vw, 38px);

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1px;
}


/* OWNER TITLE */

.owner-title {
    display: inline-block;

    margin: 5px 0 20px;

    padding: 9px 20px;

    background:
        linear-gradient(
            90deg,
            #ff8800,
            #ffb300,
            #ff8800
        );

    color: #000;

    border-radius: 25px;

    font-size: 15px;

    font-weight: 900;

    box-shadow:
        0 0 12px rgba(255,136,0,.55);
}


/* OWNER DESCRIPTION */

.owner-card p {
    margin: 10px auto;

    max-width: 560px;

    color: #ddd;

    font-size: 16px;

    line-height: 1.7;
}


/* BACK BUTTON */

.about-back {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-top: 25px;

    padding: 12px 22px;

    background: #000;

    color: #fff;

    border: 2px solid #ff8800;

    border-radius: 10px;

    text-decoration: none;

    font-weight: 900;

    transition: .25s;
}

.about-back:hover {
    background: #ff8800;

    color: #000;

    box-shadow:
        0 0 15px #ff8800;
}


/* MOBILE */

@media (max-width: 600px) {

    .about-page {
        padding:
            25px 12px 40px;
    }

    .owner-card {
        padding:
            20px 15px 25px;
    }

    .owner-photo {
        height: 350px;

        border-radius: 18px;
    }

}

</h1>

<div class="about-line"></div>


<!-- OWNER CARD -->

    <img
        src="owner.jpg"

        class="owner-photo">


    <h2>
        ANUJ GUPTA
    </h2>


    <div class="owner-title">
        OWNER • CAWNPORE TIGERS XI
    </div>


    <p>

    </p>


    <p>
        Together we roar, together we win.
    </p>


    <a

</section>
