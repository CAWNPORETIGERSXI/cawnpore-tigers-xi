<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Individual Matches - CAWNPORE TIGERS XI</title><link rel="stylesheet" href="style.css"><style>

/* =========================================
   BASIC
========================================= */

html,
body{

    margin:0;
    padding:0;

    background:#111 !important;
    color:#fff !important;

    font-family:Arial,sans-serif;

}


/* =========================================
   MAIN CONTAINER
========================================= */

.container{

    width:92%;

    max-width:900px;

    margin:30px auto;

}


/* =========================================
   PAGE TITLE
========================================= */

.page-title{

    text-align:center;

    color:#ff8800;

    margin-bottom:8px;

}


/* =========================================
   PAGE SUBTITLE
========================================= */

.page-subtitle{

    text-align:center;

    margin-bottom:30px;

}


/* =========================================
   MATCH LIST
========================================= */

#matchList{

    display:flex;

    flex-direction:column;

    align-items:center;

    width:100%;

}


/* =========================================
   MATCH CARD
========================================= */

.match-bar{

    display:flex;

    align-items:center;

    justify-content:center;

    width:330px;

    min-height:210px;

    box-sizing:border-box;

    background:#111;

    border:4px solid #ff8800;

    border-radius:18px;

    padding:20px;

    margin:0 auto 20px;

    text-decoration:none;

    color:#fff;

    text-align:center;

    transition:0.2s ease;

}


/* =========================================
   HOVER
========================================= */

.match-bar:hover{

    background:#181818;

    transform:translateY(-3px);

}


/* =========================================
   CLICK
========================================= */

.match-bar:active{

    transform:scale(0.98);

}


/* =========================================
   VS
========================================= */

.match-vs{

    color:#ff8800;

    font-weight:bold;

    font-size:20px;

    line-height:1.5;

}


/* =========================================
   OPPONENT
========================================= */

.match-opponent{

    display:block;

    color:#fff;

    font-weight:900;

    font-size:22px;

    margin-top:8px;

    line-height:1.25;

    word-break:break-word;

}


/* =========================================
   MESSAGE
========================================= */

.message{

    text-align:center;

    color:#ccc;

    margin:30px 0;

}


.error{

    color:#ff4444;

}


/* =========================================
   BACK BUTTON
========================================= */

.back-btn{

    display:block;

    text-align:center;

    background:#111;

    color:#ff8800;

    border:3px solid #ff8800;

    text-decoration:none;

    padding:12px;

    border-radius:10px;

    font-weight:bold;

    margin:30px 0;

}


.back-btn:hover{

    background:#181818;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .container{

        width:92%;

    }


    .match-bar{

        width:min(330px, 88vw);

        min-height:200px;

        padding:16px;

    }


    .match-vs{

        font-size:18px;

    }


    .match-opponent{

        font-size:20px;

    }

}

     HEADER
========================================= --><header><h1 class="page-title">
🏏 INDIVIDUAL MATCHES
</h1><p class="page-subtitle">
CAWNPORE TIGERS XI
</p></header><main class="container"><!-- =========================================
     MATCH LIST
========================================= --><div id="matchList"><p class="message">

</p></div><!-- =========================================
     BACK BUTTON
========================================= --><a

class="back-btn"

«»

⬅ BACK TO TEAM MATCHES

</a></main><footer style="text-align:center;margin:40px 0;">© 2026 CAWNPORE TIGERS XI

</footer><script type="module">


/* =========================================
   FIREBASE
========================================= */

import { db } from "./firebase.js";

import {

    collection,
    getDocs

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



const matchList =
document.getElementById(
    "matchList"
);



/* =========================================
   LOAD INDIVIDUAL MATCHES
========================================= */

async function loadIndividualMatches(){

    try{

        const snapshot =
        await getDocs(
            collection(db,"matches")
        );


        matchList.innerHTML = "";


        let matches = [];



        /* =====================================
           GET ONLY INDIVIDUAL MATCHES
        ===================================== */

        snapshot.forEach((doc)=>{

            const match =
            doc.data();


            if(

                match.eventType !==
                "Individual Matches"

            ){

                return;

            }


            matches.push({

                ...match,

                firestoreId: doc.id

            });

        });



        /* =====================================
           SORT NEWEST FIRST
        ===================================== */

        matches.sort((a,b)=>{

            const dateA =
            new Date(
                a.matchDate ||
                "1970-01-01"
            );


            const dateB =
            new Date(
                b.matchDate ||
                "1970-01-01"
            );


            return dateB - dateA;

        });



        /* =====================================
           NO MATCHES
        ===================================== */

        if(matches.length === 0){

            matchList.innerHTML = `

                <p class="message">

                    No Individual Matches
                    found yet.

                </p>

            `;

            return;

        }



        /* =====================================
           CREATE MATCH CARDS
        ===================================== */

        matches.forEach((match)=>{


            const bar =
            document.createElement("a");


            bar.className =
            "match-bar";



            /* =================================
               OPEN MATCH SUMMARY
            ================================= */

            bar.href =
            "match-summary.html?id=" +
            encodeURIComponent(
                match.matchId ||
                match.firestoreId
            );



            /* =================================
               CARD CONTENT
            ================================= */

            bar.innerHTML = `

                <span class="match-vs">

                    🏏 VS

                    <span class="match-opponent">

                        ${
                            match.opponent
                            ||
                            "Opponent Team"
                        }

                    </span>

                </span>

            `;



            matchList.appendChild(bar);

        });

    }

    catch(error){

        console.error(
            "Individual Matches Error:",
            error
        );


        matchList.innerHTML = `

            <p class="message error">

                ❌ Error loading matches.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   START
========================================= */

loadIndividualMatches();

</script></body></html>
