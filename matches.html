<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAWNPORE TIGERS XI - Matches</title>

<link rel="stylesheet" href="style.css">

<script src="matches.js"></script>
</head>

<body>

<header>
<h1>🏏 CAWNPORE TIGERS XI</h1>
<h2>Total Matches</h2>
</header>

<table border="1" width="100%">
<thead>
<tr>
<th>Sr. No.</th>
<th>Date</th>
<th>Vs.</th>
<th>Overs</th>
<th>Result</th>
</tr>
</thead>

<tbody id="matchTable">
</tbody>

</table>

<script>

const table = document.getElementById("matchTable");

matches.forEach((match, index) => {

table.innerHTML += `
<tr onclick="openMatch(${index})">
<td>${index + 1}</td>
<td>${match.date}</td>
<td>${match.opponent}</td>
<td>${match.overs}</td>
<td>${match.result}</td>
</tr>
`;

});

function openMatch(index){

let choice = confirm("Do you want to see Match Summary?");

if(choice){
window.location.href = "match.html?match=" + index;
}

}

</script>

</body>
</html>
