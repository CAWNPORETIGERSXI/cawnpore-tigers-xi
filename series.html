<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Series - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">


<style>

/* =========================================
   BASIC
========================================= */

html,
body{

    margin:0;
    padding:0;

    background:#111 !important;
    color:#fff !important;

    font-family:Arial,sans-serif;

}


/* =========================================
   MAIN CONTAINER
========================================= */

.container{

    width:92%;

    max-width:900px;

    margin:30px auto;

}


/* =========================================
   PAGE TITLE
========================================= */

.page-title{

    text-align:center;

    color:#ff8800;

    margin-bottom:25px;

}


/* =========================================
   SERIES INFORMATION CARD
========================================= */

.series-card{

    position:relative;

    background:#111;

    border:3px solid #ff8800;

    border-radius:12px;

    padding:15px;

    margin-bottom:30px;

}


/* =========================================
   SERIES IMAGE
========================================= */

.series-image{

    width:100%;

    max-height:260px;

    object-fit:contain;

    background:#000;

    border-radius:10px;

    margin-bottom:15px;

}


/* =========================================
   SERIES NAME
========================================= */

.series-name{

    font-size:27px;

    color:#ff9800;

    font-weight:bold;

    margin-bottom:8px;

}


/* =========================================
   EVENT ID
========================================= */

.series-id{

    color:#ccc;

    font-size:13px;

}


/* =========================================
   STATUS
========================================= */

.status{

    display:inline-block;

    padding:7px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    margin-top:10px;

}


.active{

    background:#063d18;

    color:#00ff66;

}


.completed{

    background:#420808;

    color:#ff4444;

}


/* =========================================
   MATCHES TITLE
========================================= */

.matches-title{

    text-align:center;

    color:#ff8800;

    margin:30px 0 20px;

}


/* =========================================
   MATCH BAR
========================================= */

.match-bar{

    display:block;

    width:100%;

    box-sizing:border-box;

    background:#111;

    border:3px solid #ff8800;

    border-radius:10px;

    padding:18px 15px;

    margin:0 0 15px;

    text-decoration:none;

    color:#fff;

    text-align:center;

    transition:0.2s ease;

}


/* =========================================
   HOVER
========================================= */

.match-bar:hover{

    background:#181818;

    transform:translateY(-2px);

}


/* =========================================
   CLICK
========================================= */

.match-bar:active{

    transform:scale(0.98);

}


/* =========================================
   VS
========================================= */

.match-vs{

    color:#ff8800;

    font-weight:bold;

}


/* =========================================
   OPPONENT
========================================= */

.match-opponent{

    color:#fff;

    font-weight:900;

}


/* =========================================
   MESSAGE
========================================= */

.message{

    text-align:center;

    color:#ccc;

    margin:30px 0;

}


.error{

    color:#ff4444;

}


/* =========================================
   BACK BUTTON
========================================= */

.back-btn{

    display:block;

    text-align:center;

    background:#111;

    color:#ff8800;

    border:3px solid #ff8800;

    text-decoration:none;

    padding:12px;

    border-radius:10px;

    font-weight:bold;

    margin:30px 0;

}


.back-btn:hover{

    background:#181818;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .container{

        width:92%;

    }


    .match-bar{

        padding:16px 8px;

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

<h1 class="page-title">
🏏 SERIES
</h1>

<p style="text-align:center;">
CAWNPORE TIGERS XI
</p>

</header>



<main class="container">


<!-- =========================================
     SERIES INFORMATION
========================================= -->

<div id="seriesInfo">

<p class="message">
⏳ Loading Series...
</p>

</div>



<!-- =========================================
     MATCH TITLE
========================================= -->

<h2 class="matches-title">
🏏 SERIES MATCHES
</h2>



<!-- =========================================
     MATCH LIST
========================================= -->

<div id="matchList">

<p class="message">
⏳ Loading Matches...
</p>

</div>



<!-- =========================================
     BACK BUTTON
========================================= -->

<a
href="series-matches.html"
class="back-btn"
>

⬅ BACK TO SERIES

</a>


</main>



<footer style="text-align:center;margin:40px 0;">

© 2026 CAWNPORE TIGERS XI

</footer>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import { db } from "./firebase.js";

import {

    collection,
    getDocs

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================
   GET EVENT ID
========================================= */

const params =
new URLSearchParams(
    window.location.search
);


const eventId =
params.get("eventId");



const seriesInfo =
document.getElementById(
    "seriesInfo"
);


const matchList =
document.getElementById(
    "matchList"
);



/* =========================================
   LOAD SERIES
========================================= */

async function loadSeries(){

    try{

        const snapshot =
        await getDocs(
            collection(db,"events")
        );


        let series = null;


        snapshot.forEach((doc)=>{

            const event =
            doc.data();


            if(

                event.eventId === eventId

                &&

                (

                    event.eventType ===
                    "Series"

                    ||

                    event.eventType ===
                    "SERIES"

                )

            ){

                series = event;

            }

        });



        if(!series){

            seriesInfo.innerHTML = `

                <p class="message error">

                    ❌ Series not found.

                </p>

            `;

            return;

        }



        /* =====================================
           STATUS
        ===================================== */

        const statusClass =
        series.status === "Completed"
        ? "completed"
        : "active";


        const statusText =
        series.status === "Completed"
        ? "🔴 COMPLETED"
        : "🟢 GOING ON";



        /* =====================================
           SERIES IMAGE
        ===================================== */

        const imageURL =

            series.imageUrl

            ||

            series.imageURL

            ||

            series.image

            ||

            "";



        seriesInfo.innerHTML = `

            <div class="series-card">


                ${
                    imageURL

                    ?

                    `

                    <img

                        src="${imageURL}"

                        class="series-image"

                        alt="Series Image"

                    >

                    `

                    :

                    ""

                }


                <div class="series-name">

                    ${
                        series.eventName
                        ||
                        "Series"
                    }

                </div>


                <div class="series-id">

                    Event ID:

                    ${
                        series.eventId
                        ||
                        eventId
                    }

                </div>


                <div class="status ${statusClass}">

                    ${statusText}

                </div>


            </div>

        `;


    }

    catch(error){

        console.error(
            "Series Error:",
            error
        );


        seriesInfo.innerHTML = `

            <p class="message error">

                ❌ Error loading Series.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   LOAD SERIES MATCHES
========================================= */

async function loadSeriesMatches(){

    try{

        const snapshot =
        await getDocs(
            collection(db,"matches")
        );


        matchList.innerHTML = "";


        let found = false;



        snapshot.forEach((doc)=>{

            const match =
            doc.data();



            /* =================================
               ONLY THIS SERIES MATCHES
            ================================= */

            if(
                match.eventId !== eventId
            ){

                return;

            }



            found = true;



            /* =================================
               CREATE MATCH BAR
            ================================= */

            const bar =
            document.createElement("a");


            bar.className =
            "match-bar";



            /* =================================
               OPEN MATCH SUMMARY
            ================================= */

            bar.href =
            "match-summary.html?id=" +
            encodeURIComponent(doc.id);



            /* =================================
               BAR CONTENT
            ================================= */

            bar.innerHTML = `

                <span class="match-vs">

                    🏏 VS

                    <span class="match-opponent">

                        ${
                            match.opponent
                            ||
                            "Opponent Team"
                        }

                    </span>

                </span>

            `;



            matchList.appendChild(bar);

        });



        /* =================================
           NO MATCHES
        ================================= */

        if(!found){

            matchList.innerHTML = `

                <p class="message">

                    No matches found for this
                    series yet.

                </p>

            `;

        }

    }

    catch(error){

        console.error(
            "Match Loading Error:",
            error
        );


        matchList.innerHTML = `

            <p class="message error">

                ❌ Error loading Series matches.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   START
========================================= */

if(eventId){

    loadSeries();

    loadSeriesMatches();

}

else{

    seriesInfo.innerHTML = `

        <p class="message error">

            ❌ Series ID not found.

        </p>

    `;


    matchList.innerHTML = "";

}


</script>



</body>

</html>
