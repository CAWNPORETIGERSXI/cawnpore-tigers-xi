<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Series - CAWNPORE TIGERS XI</title><link rel="stylesheet" href="style.css"><style>

/* =========================================
   BASIC
========================================= */

html,
body{

    margin:0;
    padding:0;

    background:#111 !important;
    color:#fff !important;

    font-family:Arial,sans-serif;

}


/* =========================================
   MAIN CONTAINER
========================================= */

.container{

    width:92%;

    max-width:900px;

    margin:30px auto;

}


/* =========================================
   PAGE TITLE
========================================= */

.page-title{

    text-align:center;

    color:#ff8800;

    margin-bottom:25px;

}


/* =========================================
   SERIES INFORMATION CARD
   WIDE RECTANGULAR CARD
========================================= */

.series-card{

    position:relative;

    width:100%;

    box-sizing:border-box;

    background:#111;

    border:3px solid #ff8800;

    border-radius:12px;

    padding:20px;

    margin:0 0 30px;

}


/* =========================================
   SERIES IMAGE
========================================= */

.series-image{

    width:100%;

    max-height:260px;

    object-fit:contain;

    background:#000;

    border-radius:10px;

    margin-bottom:15px;

}


/* =========================================
   SERIES NAME
========================================= */

.series-name{

    font-size:27px;

    color:#ff9800;

    font-weight:bold;

    margin-bottom:8px;

}


/* =========================================
   EVENT ID
========================================= */

.series-id{

    color:#ccc;

    font-size:13px;

}


/* =========================================
   STATUS
========================================= */

.status{

    display:inline-block;

    padding:7px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    margin-top:10px;

}


.active{

    background:#063d18;

    color:#00ff66;

}


.completed{

    background:#420808;

    color:#ff4444;

}


/* =========================================
   MATCHES TITLE
========================================= */

.matches-title{

    text-align:center;

    color:#ff8800;

    margin:30px 0 20px;

}


/* =========================================
   MATCH LIST
========================================= */

#matchList{

    display:flex;

    flex-direction:column;

    align-items:center;

    width:100%;

}


/* =========================================
   MATCH CARD
   CENTERED / COMPACT
========================================= */

.match-bar{

    display:flex;

    align-items:center;

    justify-content:center;

    width:330px;

    min-height:210px;

    box-sizing:border-box;

    background:#111;

    border:4px solid #ff8800;

    border-radius:18px;

    padding:20px;

    margin:0 auto 20px;

    text-decoration:none;

    color:#fff;

    text-align:center;

    transition:0.2s ease;

}


/* =========================================
   MATCH HOVER
========================================= */

.match-bar:hover{

    background:#181818;

    transform:translateY(-3px);

}


/* =========================================
   MATCH CLICK
========================================= */

.match-bar:active{

    transform:scale(0.98);

}


/* =========================================
   VS
========================================= */

.match-vs{

    color:#ff8800;

    font-weight:bold;

    font-size:20px;

    line-height:1.5;

}


/* =========================================
   OPPONENT
========================================= */

.match-opponent{

    display:block;

    color:#fff;

    font-weight:900;

    font-size:22px;

    margin-top:8px;

    line-height:1.25;

    word-break:break-word;

}


/* =========================================
   MESSAGE
========================================= */

.message{

    text-align:center;

    color:#ccc;

    margin:30px 0;

}


.error{

    color:#ff4444;

}


/* =========================================
   BACK BUTTON
========================================= */

.back-btn{

    display:block;

    text-align:center;

    background:#111;

    color:#ff8800;

    border:3px solid #ff8800;

    text-decoration:none;

    padding:12px;

    border-radius:10px;

    font-weight:bold;

    margin:30px 0;

}


.back-btn:hover{

    background:#181818;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .container{

        width:92%;

    }


    /* SERIES CARD
       FULL AVAILABLE WIDTH
    */

    .series-card{

        width:100%;

        box-sizing:border-box;

        padding:16px;

    }


    /* MATCH CARD
       CENTERED ON MOBILE
    */

    .match-bar{

        width:min(330px,88vw);

        min-height:200px;

        padding:16px;

        margin-left:auto;

        margin-right:auto;

    }


    .match-vs{

        font-size:18px;

    }


    .match-opponent{

        font-size:20px;

    }

}

/* =========================================
   FIREBASE
========================================= */

import { db } from "./firebase.js";

import {

    collection,
    getDocs

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================
   GET EVENT ID
========================================= */

const params =
new URLSearchParams(
    window.location.search
);


const eventId =
params.get("eventId");



const seriesInfo =
document.getElementById(
    "seriesInfo"
);


const matchList =
document.getElementById(
    "matchList"
);



/* =========================================
   LOAD SERIES
========================================= */

async function loadSeries(){

    try{

        const snapshot =
        await getDocs(
            collection(db,"events")
        );


        let series = null;


        snapshot.forEach((doc)=>{

            const event =
            doc.data();


            if(

                event.eventId === eventId

                &&

                (

                    event.eventType ===
                    "Series"

                    ||

                    event.eventType ===
                    "SERIES"

                )

            ){

                series = event;

            }

        });



        if(!series){

            seriesInfo.innerHTML = `

                <p class="message error">

                    ❌ Series not found.

                </p>

            `;

            return;

        }



        /* =====================================
           STATUS
        ===================================== */

        const statusClass =
        series.status === "Completed"
        ? "completed"
        : "active";


        const statusText =
        series.status === "Completed"
        ? "🔴 COMPLETED"
        : "🟢 GOING ON";



        /* =====================================
           SERIES IMAGE
        ===================================== */

        const imageURL =

            series.imageUrl

            ||

            series.imageURL

            ||

            series.image

            ||

            "";



        seriesInfo.innerHTML = `

            <div class="series-card">


                ${
                    imageURL

                    ?

                    `

                    <img

                        src="${imageURL}"

                        class="series-image"

                        alt="Series Image"

                    >

                    `

                    :

                    ""

                }


                <div class="series-name">

                    ${
                        series.eventName
                        ||
                        "Series"
                    }

                </div>


                <div class="series-id">

                    Event ID:

                    ${
                        series.eventId
                        ||
                        eventId
                    }

                </div>


                <div class="status ${statusClass}">

                    ${statusText}

                </div>


            </div>

        `;


    }

    catch(error){

        console.error(
            "Series Error:",
            error
        );


        seriesInfo.innerHTML = `

            <p class="message error">

                ❌ Error loading Series.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   LOAD SERIES MATCHES
========================================= */

async function loadSeriesMatches(){

    try{

        const snapshot =
        await getDocs(
            collection(db,"matches")
        );


        matchList.innerHTML = "";


        let found = false;



        snapshot.forEach((doc)=>{

            const match =
            doc.data();



            /* =================================
               ONLY THIS SERIES MATCHES
            ================================= */

            if(
                match.eventId !== eventId
            ){

                return;

            }



            found = true;



            /* =================================
               CREATE MATCH CARD
            ================================= */

            const bar =
            document.createElement("a");


            bar.className =
            "match-bar";



            /* =================================
               OPEN MATCH SUMMARY
            ================================= */

            bar.href =
            "match-summary.html?id=" +
            encodeURIComponent(doc.id);



            /* =================================
               CARD CONTENT
            ================================= */

            bar.innerHTML = `

                <span class="match-vs">

                    🏏 VS

                    <span class="match-opponent">

                        ${
                            match.opponent
                            ||
                            "Opponent Team"
                        }

                    </span>

                </span>

            `;



            matchList.appendChild(bar);

        });



        /* =================================
           NO MATCHES
        ================================= */

        if(!found){

            matchList.innerHTML = `

                <p class="message">

                    No matches found for this
                    series yet.

                </p>

            `;

        }

    }

    catch(error){

        console.error(
            "Match Loading Error:",
            error
        );


        matchList.innerHTML = `

            <p class="message error">

                ❌ Error loading Series matches.

                <br><br>

                ${error.message}

            </p>

        `;

    }

}



/* =========================================
   START
========================================= */

if(eventId){

    loadSeries();

    loadSeriesMatches();

}

else{

    seriesInfo.innerHTML = `

        <p class="message error">

            ❌ Series ID not found.

        </p>

    `;


    matchList.innerHTML = "";

}


</script></body></html>
