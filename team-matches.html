<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEAM MATCHES - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==============================
   TEAM MATCHES LAYOUT
============================== */

.team-matches-container{

    width:92%;
    max-width:900px;

    margin:40px auto;

}


/* ==============================
   TITLE
============================== */

.team-matches-title{

    text-align:center;

    margin-bottom:30px;

}


/* ==============================
   2 × 2 PLAYER STYLE GRID
============================== */

.team-matches-grid{

    display:grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:15px;

}


/* ==============================
   MATCH CARDS
============================== */

.match-tab{

    box-sizing:border-box;

    width:100%;

    min-height:120px;

    background:#111;

    color:#fff;

    border:3px solid #ff8800;

    border-radius:10px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    text-decoration:none;

    padding:15px;

    transition:0.2s ease;

}


/* ==============================
   CARD HOVER
============================== */

.match-tab:hover{

    background:#181818;

    transform:translateY(-2px);

}


/* ==============================
   CARD CLICK
============================== */

.match-tab:active{

    transform:scale(0.98);

}


/* ==============================
   TITLE INSIDE CARD
============================== */

.match-tab h3{

    margin:0 0 8px;

}


/* ==============================
   DESCRIPTION
============================== */

.match-tab p{

    margin:0;

    color:#fff;

}


/* ==============================
   MOBILE
============================== */

@media(max-width:600px){

    .team-matches-container{

        width:92%;

    }


    .team-matches-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:12px;

    }


    .match-tab{

        min-height:120px;

        padding:10px;

    }

}


/* ==============================
   VERY SMALL SCREENS
============================== */

@media(max-width:380px){

    .team-matches-grid{

        gap:10px;

    }

    .match-tab{

        min-height:110px;

    }

}

</style>

</head>


<body>


<!-- ==============================
     HEADER
============================== -->

<header>

<h1>🏏 TEAM MATCHES</h1>

<p>CAWNPORE TIGERS XI</p>

</header>



<!-- ==============================
     TEAM MATCHES
============================== -->

<main class="team-matches-container">


<div class="team-matches-title">

<h2>TEAM MATCHES</h2>

<p>Select Match Category</p>

</div>



<!-- ==============================
     FOUR MENU CARDS
============================== -->

<div class="team-matches-grid">


<!-- INDIVIDUAL MATCHES -->

<a
href="individual-matches.html"
class="match-tab"
>

<h3>
🏏 Individual Matches
</h3>

<p>
Individual Match Records
</p>

</a>



<!-- TOURNAMENT MATCHES -->

<a
href="tournament-matches.html"
class="match-tab"
>

<h3>
🏆 Tournament Matches
</h3>

<p>
Tournament Wise Matches
</p>

</a>



<!-- SERIES -->

<a
href="series-matches.html"
class="match-tab"
>

<h3>
🏏 Series
</h3>

<p>
Series Wise Matches
</p>

</a>



<!-- ALL MATCHES -->

<a
href="all-matches.html"
class="match-tab"
>

<h3>
📋 All Matches
</h3>

<p>
Complete Match Records
</p>

</a>


</div>


</main>



<!-- ==============================
     FOOTER
============================== -->

<footer>

© 2026 CAWNPORE TIGERS XI

</footer>


</body>

</html>
