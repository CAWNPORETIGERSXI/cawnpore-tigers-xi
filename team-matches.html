<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEAM MATCHES - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">

<style>

/* MAIN CONTAINER */

.team-matches-container {
    width: 92%;
    max-width: 900px;
    margin: 40px auto;
}


/* PAGE TITLE */

.team-matches-title {
    text-align: center;
    margin-bottom: 30px;
}

.team-matches-title h2 {
    font-size: 30px;
    margin-bottom: 8px;
}

.team-matches-title p {
    font-size: 16px;
}


/* 2 × 2 GRID */

.team-matches-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}


/* MATCH BOX */

.match-tab {

    box-sizing: border-box;

    width: 100%;
    height: 150px;

    background: #ff8800;

    color: #000;

    /* THICK BLACK OUTLINE */
    border: 4px solid #000;

    border-radius: 15px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    text-decoration: none;

    /* BLACK SHADOW */
    box-shadow: 0 5px 0 #000;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}


/* BOX TITLE */

.match-tab h3 {

    margin: 0 0 10px;

    font-size: 21px;

}


/* BOX DESCRIPTION */

.match-tab p {

    margin: 0;

    font-size: 14px;

    font-weight: bold;

}


/* HOVER EFFECT */

.match-tab:hover {

    transform: translateY(-3px);

}


/* CLICK EFFECT */

.match-tab:active {

    transform: translateY(4px);

    box-shadow: 0 1px 0 #000;

}


/* MOBILE */

@media (max-width: 600px) {

    .team-matches-grid {

        grid-template-columns: repeat(2, 1fr);

        gap: 12px;

    }


    .match-tab {

        height: 135px;

        border: 4px solid #000;

        border-radius: 12px;

        box-shadow: 0 4px 0 #000;

    }


    .match-tab h3 {

        font-size: 16px;

    }


    .match-tab p {

        font-size: 11px;

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<h1>🏏 TEAM MATCHES</h1>

<p>CAWNPORE TIGERS XI</p>

</header>


<!-- TEAM MATCHES -->

<main class="team-matches-container">


<div class="team-matches-title">

<h2>TEAM MATCHES</h2>

<p>Select Match Category</p>

</div>


<!-- FOUR MENU BOXES -->

<div class="team-matches-grid">


<!-- 1. INDIVIDUAL MATCHES -->

<a href="individual-matches.html" class="match-tab">

<h3>🏏 Individual Matches</h3>

<p>Individual Match Records</p>

</a>


<!-- 2. TOURNAMENT MATCHES -->

<a href="tournament-matches.html" class="match-tab">

<h3>🏆 Tournament Matches</h3>

<p>Tournament Wise Matches</p>

</a>


<!-- 3. SERIES -->

<a href="series-matches.html" class="match-tab">

<h3>🏏 Series</h3>

<p>Series Wise Matches</p>

</a>


<!-- 4. ALL MATCHES -->

<a href="all-matches.html" class="match-tab">

<h3>📋 All Matches</h3>

<p>Complete Match Records</p>

</a>


</div>

</main>

<footer>

</footer>


</body>

</html>
