<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEAM MATCHES - CAWNPORE TIGERS XI</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================
   BLACK WEBSITE BACKGROUND
===================================== */

html,
body {
    margin: 0;
    padding: 0;
    background: #111 !important;
    color: #fff !important;
}


/* =====================================
   TEAM MATCHES CONTAINER
===================================== */

.team-matches-container {
    width: 92%;
    max-width: 900px;
    margin: 40px auto;
}


/* =====================================
   PAGE TITLE
===================================== */

.team-matches-title {
    text-align: center;
    margin-bottom: 30px;
}


/* =====================================
   2 × 2 GRID
===================================== */

.team-matches-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}


/* =====================================
   MATCH CARDS
   SQUARE BOX + ROUNDED EDGES
===================================== */

.match-tab {

    box-sizing: border-box;

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #111 !important;

    color: #fff !important;

    border: 4px solid #ff8800;

    border-radius: 18px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    text-decoration: none;

    padding: 18px;

    transition: 0.25s ease;

    box-shadow:
        0 0 10px rgba(255,136,0,.25);
}


/* =====================================
   CARD HOVER
===================================== */

.match-tab:hover {

    background: #181818 !important;

    transform: translateY(-3px);

    box-shadow:
        0 0 18px rgba(255,136,0,.55);
}


/* =====================================
   CARD CLICK
===================================== */

.match-tab:active {
    transform: scale(0.97);
}


/* =====================================
   CARD TITLE
===================================== */

.match-tab h3 {

    margin: 0 0 10px;

    color: #fff;

    font-size: 20px;

    font-weight: 900;

    line-height: 1.25;
}


/* =====================================
   CARD DESCRIPTION
===================================== */

.match-tab p {

    margin: 0;

    color: #fff;

    font-size: 15px;

    line-height: 1.4;
}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 600px) {

    .team-matches-container {

        width: 92%;

        margin: 30px auto;
    }


    .team-matches-grid {

        grid-template-columns: repeat(2, 1fr);

        gap: 12px;
    }


    .match-tab {

        aspect-ratio: 1 / 1;

        border: 4px solid #ff8800;

        border-radius: 16px;

        padding: 10px;
    }


    .match-tab h3 {

        font-size: 16px;

        margin-bottom: 7px;
    }


    .match-tab p {

        font-size: 13px;
    }

}


/* =====================================
   SMALL MOBILE
===================================== */

@media (max-width: 380px) {

    .team-matches-grid {

        gap: 10px;
    }


    .match-tab {

        border-width: 4px;

        border-radius: 15px;

        padding: 8px;
    }


    .match-tab h3 {

        font-size: 15px;
    }


    .match-tab p {

        font-size: 12px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header>

<h1>🏏 TEAM MATCHES</h1>

<p>CAWNPORE TIGERS XI</p>

</header>



<!-- =====================================
     TEAM MATCHES
===================================== -->

<main class="team-matches-container">


    <div class="team-matches-title">

        <h2>TEAM MATCHES</h2>

        <p>Select Match Category</p>

    </div>



    <!-- =================================
         FOUR MENU CARDS
    ================================== -->

    <div class="team-matches-grid">


        <!-- 1. INDIVIDUAL MATCHES -->

        <a
            href="individual-matches.html"
            class="match-tab"
        >

            <h3>
                🏏 Individual Matches
            </h3>

            <p>
                Individual Match Records
            </p>

        </a>



        <!-- 2. TOURNAMENT MATCHES -->

        <a
            href="tournament-matches.html"
            class="match-tab"
        >

            <h3>
                🏆 Tournament Matches
            </h3>

            <p>
                Tournament Wise Matches
            </p>

        </a>



        <!-- 3. SERIES -->

        <a
            href="series-matches.html"
            class="match-tab"
        >

            <h3>
                🏏 Series
            </h3>

            <p>
                Series Wise Matches
            </p>

        </a>



        <!-- 4. ALL MATCHES -->

        <a
            href="all-matches.html"
            class="match-tab"
        >

            <h3>
                📋 All Matches
            </h3>

            <p>
                Complete Match Records
            </p>

        </a>


    </div>


</main>



<!-- =====================================
     FOOTER
===================================== -->

<footer>

© 2026 CAWNPORE TIGERS XI

</footer>


</body>

</html>
