<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Statistics | CAWNPORE TIGERS XI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    background:#ff8800;
    color:#000;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
}

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1b1b1b;
    border:2px solid #ff8800;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 12px rgba(255,136,0,0.4);
}

.card h2{
    color:#ff8800;
    font-size:18px;
    margin-bottom:10px;
}

.card p{
    font-size:30px;
    font-weight:bold;
    margin:0;
}

footer{
    text-align:center;
    background:#000;
    color:#fff;
    padding:15px;
    margin-top:40px;
}
</style>

</head>
<body>

<header>
<h1>🏆 Team Statistics</h1>
<h3>CAWNPORE TIGERS XI</h3>
</header>

<div class="container">

<div class="stats-grid">

<div class="card">
<h2>Total Matches</h2>
<p>14</p>
</div>

<div class="card">
<h2>Matches Won</h2>
<p>8</p>
</div>

<div class="card">
<h2>Matches Lost</h2>
<p>4</p>
</div>

<div class="card">
<h2>Tie / No Result</h2>
<p>2</p>
</div>

<div class="card">
<h2>Win Percentage</h2>
<p>57.14%</p>
</div>

<div class="card">
<h2>Established</h2>
<p>2025</p>
</div>

<div class="card">
<h2>Total Players</h2>
<p>25</p>
</div>

</div>

</div>

<footer>
© 2026 CAWNPORE TIGERS XI
</footer>

</body>
</html>
