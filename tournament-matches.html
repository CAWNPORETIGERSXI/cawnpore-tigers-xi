<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tournament Matches - CAWNPORE TIGERS XI</title><link rel="stylesheet" href="style.css"><style>

/* =========================================
   BASIC
========================================= */

html,
body{

    margin:0;
    padding:0;

    background:#111 !important;
    color:#fff !important;

    font-family:Arial,sans-serif;

}


/* =========================================
   CONTAINER
========================================= */

.container{

    width:92%;

    max-width:900px;

    margin:30px auto;

}


/* =========================================
   PAGE TITLE
========================================= */

h1{

    text-align:center;

    color:#ff8800;

}


/* =========================================
   EVENT LIST
========================================= */

#eventList{

    display:flex;

    flex-direction:column;

    align-items:center;

    width:100%;

}


/* =========================================
   TOURNAMENT CARD
========================================= */

.event-card{

    position:relative;

    width:92%;

    max-width:600px;

    min-height:180px;

    box-sizing:border-box;

    background:#111;

    border:5px solid #ff8800;

    border-radius:18px;

    padding:22px;

    margin:0 auto 22px;

    box-shadow:none;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    transition:0.2s ease;

}


/* =========================================
   HOVER
========================================= */

.event-card:hover{

    background:#181818;

    transform:translateY(-3px);

}


/* =========================================
   IMAGE
========================================= */

.event-image{

    width:100%;

    max-width:520px;

    height:150px;

    object-fit:contain;

    border-radius:10px;

    background:#000;

    margin-bottom:15px;

}


/* =========================================
   EVENT NAME
========================================= */

.event-name{

    font-size:25px;

    font-weight:bold;

    color:#ff9800;

    margin-bottom:8px;

    line-height:1.25;

}


/* =========================================
   EVENT ID
========================================= */

.event-id{

    font-size:13px;

    color:#ccc;

    margin-bottom:5px;

}


/* =========================================
   STATUS
========================================= */

.status{

    position:absolute;

    top:12px;

    right:14px;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    z-index:2;

}


.active{

    background:#063d18;

    color:#00ff66;

}


.completed{

    background:#420808;

    color:#ff4444;

}


/* =========================================
   VIEW BUTTON
========================================= */

.view-btn{

    display:block;

    width:100%;

    box-sizing:border-box;

    text-align:center;

    background:#ff8800;

    color:#000;

    padding:12px;

    border-radius:8px;

    text-decoration:none;

    font-weight:bold;

    margin-top:15px;

}


/* =========================================
   MESSAGE
========================================= */

.message{

    text-align:center;

    margin-top:30px;

    color:#ccc;

}


.error{

    color:#ff4444;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .container{

        width:92%;

    }


    .event-card{

        width:92vw;

        max-width:600px;

        min-height:170px;

        padding:18px;

        border-width:4px;

    }


    .event-image{

        max-width:100%;

        height:120px;

    }


    .event-name{

        font-size:21px;

    }


    .status{

        top:10px;

        right:10px;

        font-size:11px;

    }

}

</style></head><body><header><h1>🏆 TOURNAMENT MATCHES</h1><p style="text-align:center;">
CAWNPORE TIGERS XI
</p></header><main class="container"><div id="eventList"><p class="message">
⏳ Loading Tournaments...
</p></div></main><footer style="text-align:center;margin:40px 0;">© 2026 CAWNPORE TIGERS XI

</footer><script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const eventList = document.getElementById("eventList");


async function loadTournaments(){

    try{

        const snapshot = await getDocs(
            collection(db, "events")
        );

        eventList.innerHTML = "";

        let found = false;


        snapshot.forEach((doc) => {

            const event = doc.data();


            // केवल Tournament Events
            if(
                event.eventType !== "Tournament" &&
                event.eventType !== "TOURNAMENT"
            ){
                return;
            }


            found = true;


            const card = document.createElement("div");

            card.className = "event-card";


            const statusClass =
                event.status === "Completed"
                ? "completed"
                : "active";


            const statusText =
                event.status === "Completed"
                ? "🔴 COMPLETED"
                : "🟢 GOING ON";


            const imageURL =
                event.imageURL ||
                event.imageUrl ||
                event.image ||
                "";


            card.innerHTML = `

                <div class="status ${statusClass}">
                    ${statusText}
                </div>

                ${
                    imageURL
                    ?
                    `<img
                        src="${imageURL}"
                        class="event-image"
                        alt="Tournament Image"
                    >`
                    :
                    ""
                }

                <div class="event-name">
                    ${event.eventName || "Tournament"}
                </div>

                <div class="event-id">
                    Event ID: ${event.eventId || doc.id}
                </div>

                <a
                    href="tournament.html?eventId=${encodeURIComponent(event.eventId || doc.id)}"
                    class="view-btn"
                >
                    VIEW TOURNAMENT
                </a>

            `;


            eventList.appendChild(card);

        });


        if(!found){

            eventList.innerHTML = `
                <p class="message">
                    No tournaments found.
                </p>
            `;

        }

    }
    catch(error){

        console.error(
            "Tournament Loading Error:",
            error
        );


        eventList.innerHTML = `
            <p class="message error">
                ❌ Unable to load tournaments.
                <br><br>
                Please refresh the page.
            </p>
        `;

    }

}


// LOAD TOURNAMENTS
loadTournaments();

</script></body></html>
